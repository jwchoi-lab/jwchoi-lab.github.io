name: Simplify search title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-title.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update title metadata
        run: >-
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('<title>Jongwoo Choi | Harvard Biostatistics &amp; Bayesian Statistics</title>','<title>Jongwoo Choi</title>').replace('<meta property=\"og:title\" content=\"Jongwoo Choi | Harvard Biostatistics &amp; Bayesian Statistics\" />','<meta property=\"og:title\" content=\"Jongwoo Choi\" />').replace('<meta name=\"twitter:title\" content=\"Jongwoo Choi | Harvard Biostatistics &amp; Bayesian Statistics\" />','<meta name=\"twitter:title\" content=\"Jongwoo Choi\" />'); p.write_text(s, encoding='utf-8')"
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show only name in search title'
          git push
